
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Notice Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Digital Notice Board</h1>
        <p>Stay updated with the latest college announcements</p>
    </header>

    <main>
        <section id="notice-board">
            <h2>Latest Notices</h2>

            <div class="notice-controls">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search notices..."
                    aria-label="Search notices"
                >

                <select id="categoryFilter" aria-label="Filter by category">
                    <option value="All">All Categories</option>
                    <option value="Exams">Exams</option>
                    <option value="Events">Events</option>
                    <option value="General">General</option>
                </select>
            </div>

            <div id="noticeList" aria-live="polite">
                <p>Notices will appear here.</p>
            </div>
        </section>

        <section id="admin-section">
            <h2>Administrator Login</h2>

            <form id="loginForm">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter admin email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">Login</button>
            </form>

            <p id="loginMessage" aria-live="polite"></p>

            <div id="adminPanel" hidden>
                <h2>Manage Notices</h2>

                <form id="noticeForm">
                    <input type="hidden" id="noticeId">

                    <label for="noticeTitle">Notice Title</label>
                    <input
                        type="text"
                        id="noticeTitle"
                        maxlength="150"
                        placeholder="Enter notice title"
                        required
                    >

                    <label for="noticeDescription">Description</label>
                    <textarea
                        id="noticeDescription"
                        rows="4"
                        maxlength="3000"
                        placeholder="Enter notice details"
                        required
                    ></textarea>

                    <label for="noticeCategory">Category</label>
                    <select id="noticeCategory" required>
                        <option value="Exams">Exams</option>
                        <option value="Events">Events</option>
                        <option value="General">General</option>
                    </select>

                    <label for="expiryDate">Expiry Date (Optional)</label>
                    <input type="date" id="expiryDate">

                    <button type="submit" id="saveNoticeButton">
                        Publish Notice
                    </button>

                    <button type="button" id="cancelEditButton" hidden>
                        Cancel Edit
                    </button>
                </form>

                <button type="button" id="logoutButton">Logout</button>
                <p id="adminMessage" aria-live="polite"></p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Digital Notice Board | College Announcements</p>
    </footer>
<script src="script.js" defer></script>
</body>
</html>
